org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# AGP 9.0+ introduced new public DSL interfaces (BaseExtension ->
# ApplicationExtension etc). Alguns plugins de terceiros mais antigos
# ainda fazem cast para os tipos antigos internamente; esta flag mantém
# a compatibilidade com esses plugins enquanto o ecossistema migra.
# Será removida quando a AGP 10.0 descontinuar esse fallback.
android.newDsl=false

# AGP 9.0+ tambem passou a habilitar por padrao um compilador Kotlin
# embutido (android.builtInKotlin=true), que substitui o plugin
# "org.jetbrains.kotlin.android" declarado em settings.gradle. Como
# este projeto usa o plugin Kotlin classico, desabilitamos o embutido
# para evitar os dois coexistindo. Adicionado automaticamente pelo
# migrador do Flutter na primeira vez que o projeto foi buildado com a
# AGP 9.x localmente.
android.builtInKotlin=false
